[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "foresmoke"
version = "0.1.0"
description = "ForeSmoke deterministic perception-to-incident reasoning MVP"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
reasoning = ["shapely>=2,<3"]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
foresmoke-reason = "foresmoke.reasoning.__main__:main"

[tool.setuptools.packages.find]
include = ["foresmoke*"]

[tool.pytest.ini_options]
testpaths = ["tests/reasoning"]
addopts = "-ra"
