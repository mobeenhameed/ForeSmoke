[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "foresmoke"
version = "0.1.0"
description = "ForeSmoke deterministic perception-to-incident reasoning MVP"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
perception = ["opencv-python>=4.8", "numpy>=1.26", "ultralytics>=8.3"]
reasoning = ["shapely>=2,<3"]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
foresmoke-perception = "foresmoke.perception.cli:main"
foresmoke-reason = "foresmoke.reasoning.__main__:main"
foresmoke-annotate = "foresmoke.annotate:main"

[tool.setuptools.packages.find]
include = ["foresmoke*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

